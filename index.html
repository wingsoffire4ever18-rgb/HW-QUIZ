<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Science Quiz</h1>
    </header>
    <div class="content">
  <form id="sciencequiz">
    <p><strong> 1. What is the basic unit of life?</strong>
    <br>
    <input type="radio" name="q1" value="a"> Cells
    <br>
    <input type="radio" name="q1" value="b"> Water
    <br>
    <input type="radio" name="q1" value="c"> Nucleus
    </p>
      <p><strong> 2. How many planets are in the Solar System?</strong>
    <br>
    <input type="radio" name="q1" value="a"> 9
    <br>
    <input type="radio" name="q1" value="b"> 8
    <br>
    <input type="radio" name="q1" value="c"> 17
    </p>
      <p><strong> 3. What is the powerhouse of a cell?</strong>
    <br>
    <input type="radio" name="q1" value="a"> Nucleus
    <br>
    <input type="radio" name="q1" value="b"> Chloroplats
    <br>
    <input type="radio" name="q1" value="c"> Mitochondria
    </p>
   <button type="submit">Submit</button>
    </form>
    <p id="result" style="font-weight: bold; margin-top: 20px;"></p>
  </div>
 
</body>
</html>
